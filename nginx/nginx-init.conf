# Temporary config for initial certificate request
server {
    listen 80;
    server_name taletiltekst.syddjurs.dk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # BEHIND ANOTHER LOAD BALANCER / WAF? This file is written for an EDGE proxy: it sees the real client
        # address in $remote_addr and OVERWRITES X-Forwarded-For with it, so a client cannot forge it. If another
        # proxy sits in front of this one, $remote_addr is that proxy for every request, and the audit log and the
        # failed-login throttle then see one "client". Fix it here, not in the app: add, in this server block,
        #     set_real_ip_from <CIDR of the load balancer>;   # only a range you control
        #     real_ip_header  X-Forwarded-For;
        # so nginx takes the client from the header of that trusted proxy and still overwrites X-Forwarded-For.
        # See DEPLOY.md ("Behind another load balancer or WAF").
        # Overwrite, never append: the app trusts the first entry, which a client could otherwise forge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
