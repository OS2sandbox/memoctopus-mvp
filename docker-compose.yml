services:
  vllm-chat:
    image: vllm/vllm-openai:v0.19.1
    container_name: memoctopus-vllm-chat
    runtime: nvidia
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    command: --model ${VLLM_MODEL:-Qwen/Qwen3.6-27B} --gpu-memory-utilization 0.45 --max-num-seqs 32 --dtype bfloat16
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - memoctopus-network
    restart: unless-stopped

  vllm-asr:
    image: vllm/vllm-openai:v0.19.1
    container_name: memoctopus-vllm-asr
    runtime: nvidia
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8004:8000"
    command: --model ${HVISKE_MODEL:-syvai/hviske-v5.1} --trust-remote-code --task transcription --gpu-memory-utilization 0.3 --max-num-seqs 8 --dtype bfloat16
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - memoctopus-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: memoctopus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memoctopus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-memoctopus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memoctopus-network
    restart: unless-stopped

  transcription:
    build:
      context: ./transcription
      dockerfile: Dockerfile
    container_name: memoctopus-transcription
    runtime: nvidia
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_ASR_BASE_URL: http://vllm-asr:8000/v1
      HVISKE_MODEL: ${HVISKE_MODEL:-syvai/hviske-v5.1}
    volumes:
      - transcription_cache:/root/.cache
    ports:
      - "8003:8000"
    depends_on:
      vllm-asr:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - memoctopus-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memoctopus-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memoctopus}?sslmode=disable
      TRANSCRIPTION_BASE_URL: http://transcription:8000
      VLLM_BASE_URL: http://vllm-chat:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3.6-27B}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vllm-chat:
        condition: service_started
      transcription:
        condition: service_started
    networks:
      - memoctopus-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memoctopus-frontend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-memoctopus}?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      AUTHENTIK_DISCOVERY_URL: ${AUTHENTIK_DISCOVERY_URL:-}
      NEXT_PUBLIC_EMAIL_PASSWORD_ENABLED: ${NEXT_PUBLIC_EMAIL_PASSWORD_ENABLED:-}
      NEXT_PUBLIC_MICROSOFT_ENABLED: ${NEXT_PUBLIC_MICROSOFT_ENABLED:-}
      NEXT_PUBLIC_AUTHENTIK_ENABLED: ${NEXT_PUBLIC_AUTHENTIK_ENABLED:-}
      BACKEND_URL: http://backend:8000
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - memoctopus-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: memoctopus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
    networks:
      - memoctopus-network
    restart: unless-stopped

volumes:
  postgres_data:
  huggingface_cache:
  transcription_cache:

networks:
  memoctopus-network:
    driver: bridge
