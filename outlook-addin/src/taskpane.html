<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS2taletiltekst</title>
<!-- Office.js must be loaded from Microsoft's CDN, unversioned; an add-in may not bundle it. -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script defer src="taskpane.js?v=__BUILD_ID__"></script>
<style>
  :root {
    --fg: #1b1b1b; --muted: #5a5a5a; --bg: #ffffff; --line: #d1d1d1;
    --accent: #1b6b44; --ok: #0e6b2e; --warn: #7a4a00; --error: #a4262c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f0f0f0; --muted: #b5b5b5; --bg: #1f1f1f; --line: #444; --accent: #6ccf8e; --ok: #6ccf8e; --warn: #f2c063; --error: #ff8a8f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  #status { margin: 0 0 16px; }
  [data-tone="ok"] { color: var(--ok); }
  [data-tone="warn"] { color: var(--warn); }
  [data-tone="error"] { color: var(--error); }
  button { font: inherit; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  button[hidden] { display: none; }
  #arm { border: 1px solid var(--accent); background: var(--accent); color: var(--bg); }
  #disarm { border: 1px solid var(--muted); background: transparent; color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  .note { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>OS2taletiltekst</h1>
  <p id="status" role="status" aria-live="polite">Læser mødet …</p>
  <button id="arm" type="button" hidden>Slå OS2taletiltekst til</button>
  <button id="disarm" type="button" hidden>Slå OS2taletiltekst fra</button>
  <p class="note">
    Når mødet er slut, åbner du det i OS2taletiltekst for at få referatet. Indtil da bliver optagelsen i Teams.
    Når transskriptionen er hentet, slettes optagelsen. Åbner du ikke mødet inden for 30 dage, henter
    OS2taletiltekst den ikke.
  </p>
</main>
</body>
</html>
