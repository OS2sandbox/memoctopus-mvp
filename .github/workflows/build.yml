name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: memoctopus-app
            context: .
            file: Dockerfile
            build_args: |
              NEXT_PUBLIC_EMAIL_PASSWORD_ENABLED=false
              NEXT_PUBLIC_MICROSOFT_ENABLED=false
              NEXT_PUBLIC_AUTHENTIK_ENABLED=true
              NEXT_PUBLIC_APP_URL=https://referat.ai.hjoerring.local
              NEXT_PUBLIC_DIARIZATION_TIMEOUT_MS=3600000

          - name: bot-service
            image: memoctopus-bot-service
            context: ./bot-service
            file: ./bot-service/Dockerfile
            build_args: ''

          - name: diarization-service
            image: memoctopus-diarization-service
            context: ./diarization-service
            file: ./diarization-service/Dockerfile
            build_args: |
              BAKE_WEIGHTS=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}:main