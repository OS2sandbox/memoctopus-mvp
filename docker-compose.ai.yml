# ─────────────────────────────────────────────────────────────────────────────
# AI OVERLAY: adds the GPU inference services (hviske vLLM + pyannote diarization)
# and repoints the app at them. ALWAYS merge on top of the base file — it is not
# a standalone compose project:
#
#     docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d
#
# Requires a host with an NVIDIA GPU and the nvidia-container-toolkit installed
# (verify with: docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi).
# Both services share a single GPU — hviske reserves ~78% of VRAM (HVISKE_GPU_MEM_UTIL),
# leaving room for diarization (~1–2 GB), exactly as the bare-metal setup runs today.
# ─────────────────────────────────────────────────────────────────────────────
services:
  # Danish Whisper STT served by vLLM with an OpenAI-compatible API.
  # Mirrors the proven bare-metal command:
  #   vllm serve syvai/hviske-ensemble --trust-remote-code --gpu-memory-utilization 0.78 \
  #     --host 0.0.0.0 --port 40093 --api-key <key>
  # The vllm/vllm-openai image's entrypoint IS the API server, so we pass --model.
  hviske:
    # ASR needs a CUSTOM image: vllm/vllm-openai:v0.19.0 + librosa. The stock image
    # lacks librosa (vLLM can't decode audio → "Invalid or unsupported audio file"),
    # and v0.19.1+ regresses the ASR decoder. So ASR stays on v0.19.0 while the chat
    # model (vllm-chat) runs on v0.24.0 — two separate images by design. See vllm-asr/Dockerfile.
    build:
      context: ./vllm-asr
      dockerfile: Dockerfile
    image: memoctopus-vllm-asr:v0.19.0
    command:
      - --model=${HVISKE_MODEL:-syvai/hviske-ensemble}
      - --served-model-name=${HVISKE_MODEL:-syvai/hviske-ensemble}
      - --trust-remote-code
      - --gpu-memory-utilization=${HVISKE_GPU_MEM_UTIL:-0.78}
      - --host=0.0.0.0
      - --port=8000
      - --api-key=${HVISKE_API_KEY}
    environment:
      # Only needed if the model repo is gated; harmless when empty.
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      # HF weight cache. Default: a named volume (downloads once, persists across
      # restarts on this host). To REUSE pre-downloaded weights, set HF_CACHE_DIR
      # in .env to a host path holding an HF cache (e.g. /workspace/.hf_home) — it
      # then bind-mounts that instead, so hviske skips the multi-GB download.
      - ${HF_CACHE_DIR:-hf-cache}:/root/.cache/huggingface
    ports:
      # Optional external exposure; matches the legacy port. Remove to keep it
      # internal-only (the app reaches it over the compose network regardless).
      - "${HVISKE_PORT:-40093}:8000"
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Use python3 (always in the vLLM image) rather than curl, which the image
      # is not guaranteed to ship — a missing curl would fail every probe and the
      # app (depends_on: hviske healthy) would never start.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot loads the model into VRAM — can take a few minutes.
      start_period: 300s
    restart: unless-stopped
    networks:
      - internal

  # Chat LLM (minutes / PII / chapters / clarifications) served by vLLM with an
  # OpenAI-compatible API. The app's llm-client (src/lib/ai/llm-client.ts) targets
  # http://vllm-chat:8000/v1 by default when no hosted LLM_BASE_URL / OPENAI_API_KEY
  # is set, so this stays on the same `internal` network as the app.
  # Shares the GPU with hviske + diarization — keep the sum of gpu-memory-utilization
  # across the vLLM services well under 1.0 (here: 0.50 chat + 0.25 hviske).
  vllm-chat:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.24.0}
    command:
      - --model=${VLLM_MODEL:-google/gemma-4-12b-it}
      - --served-model-name=${VLLM_MODEL:-google/gemma-4-12b-it}
      - --gpu-memory-utilization=${VLLM_CHAT_GPU_MEM_UTIL:-0.50}
      - --max-model-len=${VLLM_CHAT_MAX_MODEL_LEN:-32768}
      - --max-num-seqs=${VLLM_CHAT_MAX_NUM_SEQS:-4}
      - --dtype=bfloat16
      - --host=0.0.0.0
      - --port=8000
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      # Reuse the existing HF weight cache (Gemma already downloaded here), so a
      # restart doesn't re-pull ~24 GB.
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "${VLLM_CHAT_PORT:-8001}:8000"
    ipc: host
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot loads the 12B model into VRAM — can take several minutes.
      start_period: 600s
    restart: unless-stopped
    networks:
      - internal

  # pyannote.audio speaker diarization (NOT vLLM — its own FastAPI + CUDA service).
  # Gated weights are baked in at build time via HF_TOKEN (build arg).
  diarization-service:
    build:
      context: ./diarization-service
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
        # Default true: bake the pyannote weights into the image (offline at runtime).
        # Set DIARIZATION_BAKE_WEIGHTS=false to skip the build-time download and
        # instead load weights at runtime from a mounted HF cache (see DIAR_HF_CACHE_DIR
        # below). HF_TOKEN must then be present at runtime too (it is, via env).
        BAKE_WEIGHTS: ${DIARIZATION_BAKE_WEIGHTS:-true}
    environment:
      - DIARIZATION_API_KEY=${DIARIZATION_API_KEY}
      # cuda | cpu — run pyannote on CPU when hviske saturates the shared GPU
      # (10-20x slower). The overlay still targets a GPU host (hviske needs the
      # card), so the nvidia reservation below stays even in cpu mode.
      - DIARIZATION_DEVICE=${DIARIZATION_DEVICE:-cuda}
      # Runtime token + cache home — used when weights load at runtime (BAKE_WEIGHTS=false).
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/models
    volumes:
      # Model weights at /models ($HF_HOME). Default: a named volume that Docker
      # SEEDS from the baked image on first start — so BAKE_WEIGHTS=true works and
      # weights persist across restarts without re-downloading. To REUSE a host
      # cache, set DIAR_HF_CACHE_DIR to that path (bind mount); pair it with
      # DIARIZATION_BAKE_WEIGHTS=false to also skip the build-time download.
      - ${DIAR_HF_CACHE_DIR:-diar-models}:/models
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - internal

  # Override the base app: point it at the in-compose GPU services and wait for
  # them to be healthy before starting. These environment values win over the
  # base file's (compose merges environment by key).
  app:
    environment:
      - HVISKE_URL=http://hviske:8000/v1
      - DIARIZATION_URL=http://diarization-service:5000
    depends_on:
      hviske:
        condition: service_healthy
      diarization-service:
        condition: service_healthy
      vllm-chat:
        condition: service_healthy

volumes:
  hf-cache:
  diar-models:
  huggingface_cache:
