# ─────────────────────────────────────────────────────────────────────────────
# BASE STACK ("small"): the CPU-only application — Next.js app, Teams bot,
# Postgres. Self-contained; talks to hviske/diarization hosted ELSEWHERE
# (set HVISKE_URL / DIARIZATION_URL in .env to the remote box):
#
#     docker compose up -d
#
# To run the WHOLE system on a Docker + NVIDIA host, merge the AI overlay — it
# adds the GPU services and repoints the app at them automatically:
#
#     docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d
#
# Everything is driven by .env (copy from .env.deploy.example), so moving to a
# new server is: clone repo → edit .env → compose up. See DEPLOY.md.
# ─────────────────────────────────────────────────────────────────────────────
services:
  # Self-contained PostgreSQL. The app stores better-auth tables in `public` and
  # creates a per-user schema (u_<userId>) lazily at runtime. Data persists on the
  # `pgdata` named volume.
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-referat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-referat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-referat} -d ${POSTGRES_DB:-referat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot: applies the drizzle migrations (better-auth public tables) and exits.
  # Built from the lightweight `migrate` stage (drizzle-kit + config + SQL only) so
  # it doesn't pay for / depend on a full Next.js build. CMD is the drizzle-kit run.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be passed at build time (Next inlines them into the
      # browser bundle); the matching `environment` entry below only covers the
      # server-side read. Change this → rebuild (`up -d --build`). Auth config is
      # not here on purpose — it is runtime-only, see `environment` below.
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
    ports:
      - "${APP_PORT:-8080}:3000"
    # Lets the container reach services on the Docker host (e.g. an SSH tunnel to a
    # GPU box's diarization at host.docker.internal:5000). Automatic on Docker
    # Desktop; this makes it work on Linux hosts too. Harmless if unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Chat LLM backend (minutes/PII/chapters/clarifications): with an OPENAI_API_KEY
      # set, it uses hosted OpenAI; with none, it falls back to the self-hosted vLLM
      # (vllm-chat). LLM_BASE_URL / LLM_MODEL override the endpoint + model explicitly.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # Prompt sizing. There is no env_file here, so a variable absent from this list
      # never reaches the container and silently falls back to its default.
      - LLM_CONTEXT_TOKENS=${LLM_CONTEXT_TOKENS:-}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-}
      - LLM_CHARS_PER_TOKEN=${LLM_CHARS_PER_TOKEN:-}
      - LLM_PROMPT_RESERVE_TOKENS=${LLM_PROMPT_RESERVE_TOKENS:-}
      - LLM_CHAPTER_SPLIT_CHARS=${LLM_CHAPTER_SPLIT_CHARS:-}
      - LLM_CHAPTER_SUMMARY_MAX_TOKENS=${LLM_CHAPTER_SUMMARY_MAX_TOKENS:-}
      # AI service endpoints. In the base ("small") stack these point at a
      # remote host (set in .env). The AI overlay overrides them to the in-compose
      # service names (http://hviske:8000/v1, http://diarization-service:5000).
      - HVISKE_URL=${HVISKE_URL}
      - HVISKE_API_KEY=${HVISKE_API_KEY}
      - HVISKE_MODEL=${HVISKE_MODEL:-syvai/hviske-ensemble}
      - HVISKE_DIARIZE=${HVISKE_DIARIZE:-false}
      - ASR_LANGUAGE=${ASR_LANGUAGE:-da}
      - DIARIZATION_URL=${DIARIZATION_URL}
      - DIARIZATION_API_KEY=${DIARIZATION_API_KEY}
      - AUDIO_STORAGE_PATH=/audio-storage
      - BOT_SERVICE_URL=http://bot-service:3001
      - BOT_INTERNAL_SECRET=${BOT_INTERNAL_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      # Auth. All read at runtime — change these and `up -d app` is enough, no rebuild.
      - EMAIL_PASSWORD_ENABLED=${EMAIL_PASSWORD_ENABLED:-}
      - MICROSOFT_ENABLED=${MICROSOFT_ENABLED:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
      # Generic OIDC (Keycloak, Authentik, any compliant IdP).
      - OIDC_ENABLED=${OIDC_ENABLED:-}
      - OIDC_PROVIDER_ID=${OIDC_PROVIDER_ID:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - OIDC_PKCE=${OIDC_PKCE:-}
      # Deprecated aliases, still honoured so existing .env files keep working.
      # Empty (not "true") defaults, so an unset variable stays unset.
      - NEXT_PUBLIC_EMAIL_PASSWORD_ENABLED=${NEXT_PUBLIC_EMAIL_PASSWORD_ENABLED:-}
      - NEXT_PUBLIC_MICROSOFT_ENABLED=${NEXT_PUBLIC_MICROSOFT_ENABLED:-}
      - NEXT_PUBLIC_AUTHENTIK_ENABLED=${NEXT_PUBLIC_AUTHENTIK_ENABLED:-}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET:-}
      - AUTHENTIK_DISCOVERY_URL=${AUTHENTIK_DISCOVERY_URL:-}
    volumes:
      - audio-storage:/audio-storage
    networks:
      - internal
    depends_on:
      bot-service:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1 (not localhost): inside the container `localhost` resolves to
      # IPv6 ::1 first, but next-server listens on IPv4 0.0.0.0 only — a localhost
      # probe gets "connection refused" and the container is wrongly unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  bot-service:
    build:
      context: ./bot-service
      dockerfile: Dockerfile
    # No public port binding — only the app service needs to reach this via
    # the internal Docker network (http://bot-service:3001). Exposing it
    # publicly would bypass the Next.js proxy and its auth checks.
    environment:
      - BOT_PORT=3001
      - NEXT_APP_URL=http://app:3000
      - BOT_INTERNAL_SECRET=${BOT_INTERNAL_SECRET}
      - BOT_MAX_SESSIONS=${BOT_MAX_SESSIONS:-5}
      # Chromium runs headed against Xvfb (started by entrypoint.sh) so Teams'
      # anti-bot heuristics don't detect headless mode and trigger post-
      # admission "Leaving..." cascades. Override to true only for debugging.
      - HEADLESS=false
      - DISPLAY=:99
      # Capture prejoin/launcher screenshots to /tmp/bot-snap-*.png for debugging.
      - BOT_DEBUG_SNAPSHOTS=${BOT_DEBUG_SNAPSHOTS:-0}
    networks:
      - internal
    shm_size: "2gb"
    mem_limit: 6g
    memswap_limit: 6g
    oom_score_adj: 500
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  audio-storage:
  pgdata:
