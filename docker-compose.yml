# ─────────────────────────────────────────────────────────────────────────────
# BASE STACK ("small"): the CPU-only application — Next.js app (Teams via
# Microsoft Graph) and Postgres. Self-contained; talks to hviske/diarization
# hosted ELSEWHERE (set HVISKE_URL / DIARIZATION_URL in .env to the remote box):
#
#     docker compose up -d
#
# To run the WHOLE system on a Docker + NVIDIA host, merge the AI overlay — it
# adds the GPU services and repoints the app at them automatically:
#
#     docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d
#
# Everything is driven by .env (copy from .env.example and fill in its "COMPOSE /
# DEPLOYMENT ONLY" block), so moving to a new server is: clone repo → edit .env →
# compose up. See DEPLOY.md.
# ─────────────────────────────────────────────────────────────────────────────
services:
  # Self-contained PostgreSQL. The app stores better-auth tables in `public` and
  # creates a per-user schema (u_<userId>) lazily at runtime. Data persists on the
  # `pgdata` named volume.
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-referat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-referat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-referat} -d ${POSTGRES_DB:-referat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot: applies the drizzle migrations (better-auth public tables) and exits.
  # Built from the lightweight `migrate` stage (drizzle-kit + config + SQL only) so
  # it doesn't pay for / depend on a full Next.js build. CMD is the drizzle-kit run.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be passed at build time (Next inlines them into the
      # browser bundle); the matching `environment` entry below only covers the
      # server-side read. Change this → rebuild (`up -d --build`). Auth config is
      # not here on purpose — it is runtime-only, see `environment` below.
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
        # Browser-side diarization timeout. Build-time only: set it → rebuild.
        # Keep it equal to DIARIZATION_TIMEOUT_MS below.
        NEXT_PUBLIC_DIARIZATION_TIMEOUT_MS: ${NEXT_PUBLIC_DIARIZATION_TIMEOUT_MS:-300000}
    # Published on ALL host interfaces. Behind a reverse proxy, bind it to loopback
    # ("127.0.0.1:${APP_PORT:-8080}:3000" via an override) or firewall it: the app
    # trusts the first X-Forwarded-For entry (audit IP, login throttle), so anyone
    # who can reach this port directly can forge it. See DEPLOY.md.
    ports:
      - "${APP_PORT:-8080}:3000"
    # Lets the container reach services on the Docker host (e.g. an SSH tunnel to a
    # GPU box's diarization at host.docker.internal:5000). Automatic on Docker
    # Desktop; this makes it work on Linux hosts too. Harmless if unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Chat LLM backend (minutes/PII/chapters/clarifications): with an OPENAI_API_KEY
      # set, it uses hosted OpenAI; with none, it falls back to the self-hosted vLLM
      # (vllm-chat). LLM_BASE_URL / LLM_MODEL override the endpoint + model explicitly.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      # Context window and output cap of the chat model; minutes generation sizes its
      # prompt from them. The app itself falls back to VLLM_CHAT_MAX_MODEL_LEN when
      # LLM_CONTEXT_TOKENS is unset, so one number configures both vLLM and the app —
      # done in app code (getLlmLimits), not here, so it does not depend on a Compose
      # version resolving a ${VAR:-${VAR2:-}} nested substitution.
      - LLM_CONTEXT_TOKENS=${LLM_CONTEXT_TOKENS:-}
      - VLLM_CHAT_MAX_MODEL_LEN=${VLLM_CHAT_MAX_MODEL_LEN:-}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-}
      # AI service endpoints. In the base ("small") stack these point at a
      # remote host (set in .env). The AI overlay overrides them to the in-compose
      # service names (http://hviske:8000/v1, http://diarization-service:5000).
      - HVISKE_URL=${HVISKE_URL}
      - HVISKE_API_KEY=${HVISKE_API_KEY}
      - HVISKE_MODEL=${HVISKE_MODEL:-syvai/hviske-ensemble}
      - HVISKE_DIARIZE=${HVISKE_DIARIZE:-false}
      - ASR_LANGUAGE=${ASR_LANGUAGE:-da}
      - DIARIZATION_URL=${DIARIZATION_URL}
      - DIARIZATION_API_KEY=${DIARIZATION_API_KEY}
      # Server-side diarization timeout (app → diarization service). Runtime: change
      # it and `up -d app` is enough. Pair with NEXT_PUBLIC_DIARIZATION_TIMEOUT_MS.
      - DIARIZATION_TIMEOUT_MS=${DIARIZATION_TIMEOUT_MS:-300000}
      - AUDIO_STORAGE_PATH=/audio-storage
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      # Auth. All read at runtime — change these and `up -d app` is enough, no rebuild.
      # Blank = unset: on by default in local/rollekatalog mode; ignored (always off) with ACCESS_SOURCE=claims.
      - EMAIL_PASSWORD_ENABLED=${EMAIL_PASSWORD_ENABLED:-}
      - MICROSOFT_ENABLED=${MICROSOFT_ENABLED:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
      # Teams via Microsoft Graph. Runtime-only, like the auth block above.
      # Unset is fine everywhere — the code defaults to Teams OFF, public Graph,
      # da-DK, prefer-recording and a 120s poll.
      # Opt-in: "true" adds the Graph scopes to the Microsoft sign-in. Two of them
      # need tenant-admin consent, so switching this on before the admin has
      # granted it makes EVERY Microsoft sign-in fail with "Need admin approval".
      # Read once at startup, so changing it needs `up -d app` (a restart).
      - TEAMS_GRAPH_ENABLED=${TEAMS_GRAPH_ENABLED:-}
      - GRAPH_BASE_URL=${GRAPH_BASE_URL:-}
      - TEAMS_SPOKEN_LANGUAGE=${TEAMS_SPOKEN_LANGUAGE:-}
      # prefer-recording (default) re-transcribes Teams' recording with hviske and
      # takes speaker names from the VTT; transcript-only skips the download,
      # the ffmpeg transcode and the audio-at-rest entirely.
      - TEAMS_ARTIFACT_MODE=${TEAMS_ARTIFACT_MODE:-}
      # Unset = on: once a recording is transcribed, its file is deleted from the
      # organizer's OneDrive. That is what adds Files.ReadWrite to the sign-in, so
      # the same "consent first" rule applies; "false" drops both.
      - TEAMS_DELETE_RECORDING=${TEAMS_DELETE_RECORDING:-}
      - TEAMS_POLL_INTERVAL_MS=${TEAMS_POLL_INTERVAL_MS:-}
      # Set true on any instance that must not poll Graph (build/CI containers).
      # Instances are already serialised by a Postgres advisory lock, so leaving
      # it unset on several replicas is safe.
      - TEAMS_POLLER_DISABLED=${TEAMS_POLLER_DISABLED:-}
      # Identity providers (several OIDC, Entra, SAML) and role claims from ONE JSON file,
      # mounted at /config (see the volume below). Set AUTH_CONFIG_FILE=/config/auth.json
      # to use it; it then REPLACES the MICROSOFT_* / OIDC_* variables. Format and recipes:
      # docs/central-access/idp.md. Read once at start: edit, then `up -d app`.
      - AUTH_CONFIG_FILE=${AUTH_CONFIG_FILE:-}
      # Generic OIDC (Keycloak, Authentik, any compliant IdP). Ignored when AUTH_CONFIG_FILE is set.
      - OIDC_ENABLED=${OIDC_ENABLED:-}
      - OIDC_PROVIDER_ID=${OIDC_PROVIDER_ID:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - OIDC_PKCE=${OIDC_PKCE:-}
      # Deprecated aliases, still honoured so existing .env files keep working.
      # Empty (not "true") defaults, so an unset variable stays unset.
      - NEXT_PUBLIC_EMAIL_PASSWORD_ENABLED=${NEXT_PUBLIC_EMAIL_PASSWORD_ENABLED:-}
      - NEXT_PUBLIC_MICROSOFT_ENABLED=${NEXT_PUBLIC_MICROSOFT_ENABLED:-}
      - NEXT_PUBLIC_AUTHENTIK_ENABLED=${NEXT_PUBLIC_AUTHENTIK_ENABLED:-}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID:-}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET:-}
      - AUTHENTIK_DISCOVERY_URL=${AUTHENTIK_DISCOVERY_URL:-}
      # Central access control. Read at runtime (no rebuild). Defaults keep
      # today's behaviour: local roles, everyone gets the baseline role.
      # local | rollekatalog | claims. claims = roles come from the IdP at login (idp.md).
      - ACCESS_SOURCE=${ACCESS_SOURCE:-local}
      # Kill switch for the in-app role administration (local mode only; always off otherwise).
      - ACCESS_LOCAL_ADMIN=${ACCESS_LOCAL_ADMIN:-}
      # Claims mode: how long the roles of a login count (and how long a session lasts). Blank = 28800 (8 h).
      - ROLE_CLAIMS_MAX_SECONDS=${ROLE_CLAIMS_MAX_SECONDS:-}
      # Blank = unset: the default is then false, EXCEPT with ACCESS_SOURCE=claims where it is true (no mapped
      # role, no access). Do not give it a default here: an explicit "false" is what opens claims mode.
      - REQUIRE_ROLE_TO_LOGIN=${REQUIRE_ROLE_TO_LOGIN:-}
      - BOOTSTRAP_ADMIN_EMAILS=${BOOTSTRAP_ADMIN_EMAILS:-}
      - DIRECTORY_MATCH=${DIRECTORY_MATCH:-userid-claim}
      - DIRECTORY_USERID_CLAIM=${DIRECTORY_USERID_CLAIM:-preferred_username}
      - AUTH_IP_HEADERS=${AUTH_IP_HEADERS:-}
      # Rollekatalog (read-only authority; only used with ACCESS_SOURCE=rollekatalog).
      # Runtime config, no rebuild. The API keys are blank by default; see
      # docs/central-access/rollekatalog.md. The sync is scheduled by a host or cluster
      # cron that calls POST /api/internal/rollekatalog/sync (DEPLOY.md).
      - ROLLEKATALOG_URL=${ROLLEKATALOG_URL:-}
      - ROLLEKATALOG_READ_API_KEY=${ROLLEKATALOG_READ_API_KEY:-}
      - ROLLEKATALOG_ORG_API_KEY=${ROLLEKATALOG_ORG_API_KEY:-}
      - ROLLEKATALOG_ITSYSTEM_ID=${ROLLEKATALOG_ITSYSTEM_ID:-os2taletiltekst}
      - ROLLEKATALOG_DOMAIN=${ROLLEKATALOG_DOMAIN:-}
      - ROLLEKATALOG_TIMEOUT_MS=${ROLLEKATALOG_TIMEOUT_MS:-120000}
      - ROLLEKATALOG_MAX_RESPONSE_BYTES=${ROLLEKATALOG_MAX_RESPONSE_BYTES:-}
      - ROLLEKATALOG_ALLOW_HTTP=${ROLLEKATALOG_ALLOW_HTTP:-}
      - ROLLEKATALOG_SCOPE_DESCENDANTS=${ROLLEKATALOG_SCOPE_DESCENDANTS:-true}
      - ROLLEKATALOG_GLOBAL_ROLES=${ROLLEKATALOG_GLOBAL_ROLES:-admin}
      - ROLLEKATALOG_ROLES_PATH=${ROLLEKATALOG_ROLES_PATH:-}
      - ROLLEKATALOG_ROLEGROUPS_PATH=${ROLLEKATALOG_ROLEGROUPS_PATH:-}
      - ROLLEKATALOG_SYNC_MAX_REMOVAL_PERCENT=${ROLLEKATALOG_SYNC_MAX_REMOVAL_PERCENT:-30}
      - ROLE_STALE_MAX_SECONDS=${ROLE_STALE_MAX_SECONDS:-86400}
      - DIRECTORY_USERID_TRANSFORM=${DIRECTORY_USERID_TRANSFORM:-none}
      - DIRECTORY_USERID_DOMAIN=${DIRECTORY_USERID_DOMAIN:-}
      # Skabelon sharing. Read at runtime (no rebuild). Code sharing is on unless "false";
      # link sharing (server-stored token) is opt-in, "true" turns it on.
      - SKABELON_SHARE_CODE=${SKABELON_SHARE_CODE:-true}
      - SKABELON_SHARE_LINK=${SKABELON_SHARE_LINK:-false}
      # Audit log. Read at runtime (no rebuild). Records activity metadata only, never
      # content; see docs/central-access/audit.md. The /api/internal cron routes
      # answer 404 until INTERNAL_CRON_SECRET is set.
      # Retention defaults to 365 days in code; blank keeps that default.
      - AUDIT_STDOUT=${AUDIT_STDOUT:-false}
      - AUDIT_STORE_IP=${AUDIT_STORE_IP:-true}
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-}
      - AUDIT_CLIENT_EVENTS_DAILY_CAP=${AUDIT_CLIENT_EVENTS_DAILY_CAP:-}
      - INTERNAL_CRON_SECRET=${INTERNAL_CRON_SECRET:-}
    volumes:
      - audio-storage:/audio-storage
      # The auth config file and anything it points at (SAML metadata, certificates), read-only.
      # A missing host directory is created empty by Docker and is harmless without AUTH_CONFIG_FILE.
      - ${AUTH_CONFIG_DIR:-./auth-config}:/config:ro
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1 (not localhost): inside the container `localhost` resolves to
      # IPv6 ::1 first, but next-server listens on IPv4 0.0.0.0 only — a localhost
      # probe gets "connection refused" and the container is wrongly unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  audio-storage:
  pgdata:
